<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodify - Music for Your Mood</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --primary-dark: #5649c0;
            --secondary-color: #a29bfe;
            --dark-color: #2d3436;
            --light-color: #f5f6fa;
            --text-color: #333;
            --text-light: #636e72;
            --card-bg: #ffffff;
            --player-bg: #ffffff;
            --header-bg: #ffffff;
            --section-bg: #f9f9f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--header-bg);
            padding: 1rem 2rem;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-right: 10px;
            font-size: 1.5rem;
        }

        .search-container {
            display: flex;
            width: 40%;
            position: relative;
        }

        #search-input {
            padding: 0.8rem 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            width: 100%;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        #search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 2px 12px rgba(108, 92, 231, 0.2);
        }

        #search-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            position: absolute;
            right: 0;
            height: 100%;
            box-shadow: 0 2px 8px rgba(108, 92, 231, 0.3);
        }

        #search-btn:hover {
            background-color: var(--primary-dark);
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        nav a.active, nav a:hover {
            color: var(--primary-color);
            background-color: rgba(108, 92, 231, 0.1);
        }

        main {
            flex: 1;
            padding: 2rem;
            background-color: var(--section-bg);
        }

        .mood-selection {
            margin-bottom: 3rem;
            text-align: center;
        }

        .mood-selection h2 {
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-size: 1.8rem;
            color: var(--dark-color);
        }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .mood-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 1.8rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .mood-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .mood-card i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            transition: all 0.3s;
        }

        .mood-card:hover i {
            transform: scale(1.1);
        }

        .mood-card span {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .results-section {
            margin-top: 3rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-header h2 {
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--dark-color);
        }

        .view-all {
            color: var(--primary-color);
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
        }

        .view-all:hover {
            text-decoration: underline;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .song-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .song-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .song-thumbnail {
            width: 100%;
            height: 140px;
            object-fit: cover;
            transition: all 0.3s;
        }

        .song-card:hover .song-thumbnail {
            opacity: 0.9;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: all 0.3s;
        }

        .song-card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            color: white;
            font-size: 2.5rem;
            background-color: rgba(108, 92, 231, 0.8);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .song-info {
            padding: 1rem;
        }

        .song-title {
            font-weight: 600;
            margin-bottom: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 0.85rem;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-duration {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 0.3rem;
        }

        .player-container {
            background-color: var(--player-bg);
            padding: 1rem 2rem;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.08);
            position: sticky;
            bottom: 0;
            z-index: 90;
        }

        .player {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
            gap: 2rem;
        }

        .player .song-info {
            display: flex;
            align-items: center;
            width: 25%;
            min-width: 250px;
        }

        .player .song-info img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            margin-right: 1rem;
            object-fit: cover;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .player .song-info-text {
            flex: 1;
            min-width: 0;
        }

        .player .song-info h3 {
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }

        .player .song-info p {
            font-size: 0.85rem;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            max-width: 600px;
        }

        .player-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .player-controls button {
            background: none;
            border: none;
            font-size: 1.3rem;
            margin: 0 1rem;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.3s;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-controls button:hover {
            color: var(--primary-color);
            background-color: rgba(108, 92, 231, 0.1);
        }

        #play-btn {
            font-size: 1.8rem;
            background-color: var(--primary-color);
            color: white;
            width: 50px;
            height: 50px;
        }

        #play-btn:hover {
            background-color: var(--primary-dark);
            transform: scale(1.05);
        }

        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 1rem;
        }

        #progress-bar {
            flex: 1;
            height: 6px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
        }

        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }

        .progress-container span {
            font-size: 0.85rem;
            color: var(--text-light);
            min-width: 40px;
            text-align: center;
        }

        .volume-control {
            display: flex;
            align-items: center;
            width: 15%;
            min-width: 150px;
            gap: 0.5rem;
        }

        .volume-control i {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        #volume-bar {
            flex: 1;
            height: 5px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
        }

        #volume-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }

        #player-placeholder {
            display: none;
        }

        /* Loading animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(108, 92, 231, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .player {
                gap: 1rem;
            }
            
            .player .song-info {
                min-width: 200px;
            }
            
            .volume-control {
                min-width: 120px;
            }
        }

        @media (max-width: 992px) {
            header {
                flex-direction: column;
                padding: 1rem;
                gap: 1rem;
            }

            .search-container {
                width: 100%;
            }

            nav {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .mood-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }

            .player {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }

            .player .song-info {
                width: 100%;
                justify-content: center;
                min-width: 0;
            }

            .player-controls {
                order: 1;
                width: 100%;
            }

            .volume-control {
                order: 2;
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .mood-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .player-buttons button {
                margin: 0 0.5rem;
            }
        }

        @media (max-width: 576px) {
            .mood-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .player-controls button {
                margin: 0 0.3rem;
                font-size: 1.1rem;
            }

            #play-btn {
                font-size: 1.5rem;
                width: 45px;
                height: 45px;
            }
        }
        
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-music"></i>
            <span>Moodify</span>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search songs or moods...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <nav>
            <a href="#" class="active"><i class="fas fa-home"></i> Home</a>
            <a href="#"><i class="fas fa-heart"></i> Favorites</a>
            <a href="#"><i class="fas fa-compass"></i> Discover</a>
            <a href="#"><i class="fas fa-sliders-h"></i> Settings</a>
        </nav>
    </header>

    <main>
        <section class="mood-selection">
            <h2>How are you feeling today?</h2>
            <p class="subtitle">Select your mood and we'll find the perfect music for you</p>
            <div class="mood-grid">
                <div class="mood-card" data-mood="happy">
                    <i class="fas fa-laugh-beam"></i>
                    <span>Happy</span>
                </div>
                <div class="mood-card" data-mood="sad">
                    <i class="fas fa-sad-tear"></i>
                    <span>Sad</span>
                </div>
                <div class="mood-card" data-mood="energetic">
                    <i class="fas fa-bolt"></i>
                    <span>Energetic</span>
                </div>
                <div class="mood-card" data-mood="chill">
                    <i class="fas fa-umbrella-beach"></i>
                    <span>Chill</span>
                </div>
                <div class="mood-card" data-mood="focused">
                    <i class="fas fa-brain"></i>
                    <span>Focused</span>
                </div>
                <div class="mood-card" data-mood="romantic">
                    <i class="fas fa-heart"></i>
                    <span>Romantic</span>
                </div>
            </div>
        </section>

        <section class="results-section">
            <div class="section-header">
                <h2 id="results-title">Popular Songs</h2>
                <a href="#" class="view-all">View All</a>
            </div>
            <div class="results-grid" id="results-container">
                <!-- Songs will be loaded here -->
            </div>
        </section>
    </main>

    <div class="player-container">
        <div class="player">
            <div class="song-info">
                <img id="current-thumbnail" src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Song thumbnail">
                <div class="song-info-text">
                    <h3 id="current-title">No song selected</h3>
                    <p id="current-artist">Select a song to begin</p>
                </div>
            </div>
            <div class="player-controls">
                <div class="player-buttons">
                    <button id="shuffle-btn"><i class="fas fa-random"></i></button>
                    <button id="prev-btn"><i class="fas fa-step-backward"></i></button>
                    <button id="play-btn"><i class="fas fa-play"></i></button>
                    <button id="next-btn"><i class="fas fa-step-forward"></i></button>
                    <button id="repeat-btn"><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" min="0" max="100" value="0">
                    <span id="duration">0:00</span>
                </div>
            </div>
            <div class="volume-control">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volume-bar" min="0" max="100" value="50">
            </div>
        </div>
    </div>

    <div id="player-placeholder"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // YouTube API Key - REPLACE THIS WITH YOUR OWN KEY
        const YOUTUBE_API_KEY = 'AIzaSyCss9WSgtXJbzDbKXbtoB1U8_6LfvrZCqM';
        
        // Player variables
        let player;
        let currentSongIndex = 0;
        let songs = [];
        let currentMood = 'happy';
        let isPlaying = false;
        let isShuffleOn = false;
        let isRepeatOn = false;
        let progressInterval;

        // Mood to YouTube search query mapping
        const moodQueries = {
            happy: 'happy pop music',
            sad: 'sad emotional songs',
            energetic: 'high energy workout music',
            chill: 'chill lofi beats',
            focused: 'focus study music',
            romantic: 'romantic love songs'
        };

        // Initialize YouTube player
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-placeholder', {
                height: '0',
                width: '0',
                playerVars: {
                    controls: 0,
                    disablekb: 1,
                    modestbranding: 1,
                    rel: 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log('YouTube player ready');
            // Load saved state
            const savedState = localStorage.getItem('moodifyState');
            if (savedState) {
                const state = JSON.parse(savedState);
                // Set volume from saved state
                const volume = state.volume || 50;
                event.target.setVolume(volume);
                document.getElementById('volume-bar').value = volume;
                
                // Load current song if available
                if (state.songs && state.songs.length > 0 && state.currentSongIndex >= 0) {
                    const song = state.songs[state.currentSongIndex];
                    updateCurrentSongInfo(song);
                    
                    // If song was playing before refresh, play it again
                    if (state.isPlaying) {
                        player.loadVideoById(song.videoId);
                        player.playVideo();
                    }
                }
            } else {
                // Default volume
                event.target.setVolume(50);
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                if (isRepeatOn) {
                    player.playVideo();
                } else {
                    playNextSong();
                }
            } else if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('play-btn').innerHTML = '<i class="fas fa-pause"></i>';
                startProgressTimer();
                savePlayerState();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i>';
                clearInterval(progressInterval);
                savePlayerState();
            }
        }

        // Save player state to localStorage
        function savePlayerState() {
            localStorage.setItem('moodifyState', JSON.stringify({
                currentSongIndex,
                songs,
                currentMood,
                volume: player?.getVolume() || 50,
                isPlaying,
                isShuffleOn,
                isRepeatOn
            }));
        }

        // Load player state from localStorage
        function loadPlayerState() {
            const savedState = localStorage.getItem('moodifyState');
            if (savedState) {
                const state = JSON.parse(savedState);
                currentSongIndex = state.currentSongIndex || 0;
                songs = state.songs || [];
                currentMood = state.currentMood || 'happy';
                isPlaying = state.isPlaying || false;
                isShuffleOn = state.isShuffleOn || false;
                isRepeatOn = state.isRepeatOn || false;
                
                if (songs.length > 0) {
                    displaySongs(songs);
                    updateCurrentSongInfo(songs[currentSongIndex]);
                    
                    // Update UI state
                    document.getElementById('play-btn').innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
                    document.getElementById('shuffle-btn').style.color = isShuffleOn ? 'var(--primary-color)' : 'var(--text-color)';
                    document.getElementById('repeat-btn').style.color = isRepeatOn ? 'var(--primary-color)' : 'var(--text-color)';
                    
                    // Set the current mood title
                    document.getElementById('results-title').textContent = 
                        currentMood === 'search' ? 'Search Results' : 
                        `${currentMood.charAt(0).toUpperCase() + currentMood.slice(1)} Songs`;
                }
            }
        }

        // Start progress timer when playing
        function startProgressTimer() {
            clearInterval(progressInterval);
            updateProgressBar();
            progressInterval = setInterval(updateProgressBar, 1000);
        }

        // Update progress bar during playback
        function updateProgressBar() {
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const duration = player.getDuration();
                const currentTime = player.getCurrentTime();
                
                document.getElementById('current-time').textContent = formatTime(currentTime);
                document.getElementById('duration').textContent = formatTime(duration);
                document.getElementById('progress-bar').value = (currentTime / duration) * 100;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Fetch videos from YouTube API
        async function fetchYouTubeVideos(query) {
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
                const data = await response.json();
                
                if (!data.items) return [];
                
                // Get video durations
                const videoIds = data.items.map(item => item.id.videoId).join(',');
                const durationResponse = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoIds}&key=${YOUTUBE_API_KEY}`);
                const durationData = await durationResponse.json();
                
                return data.items.map((item, index) => {
                    const durationItem = durationData.items.find(d => d.id === item.id.videoId);
                    return {
                        videoId: item.id.videoId,
                        title: item.snippet.title,
                        artist: item.snippet.channelTitle,
                        thumbnail: item.snippet.thumbnails?.high?.url || `https://i.ytimg.com/vi/${item.id.videoId}/hqdefault.jpg`,
                        duration: durationItem ? formatYouTubeDuration(durationItem.contentDetails.duration) : '--:--'
                    };
                });
            } catch (error) {
                console.error('Error fetching YouTube videos:', error);
                showError("Failed to load songs. Please try again later.");
                return [];
            }
        }

        function formatYouTubeDuration(duration) {
            // Convert ISO 8601 duration to MM:SS
            const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
            const hours = (parseInt(match[1]) || 0);
            const minutes = (parseInt(match[2]) || 0);
            const seconds = (parseInt(match[3]) || 0);
            
            return hours > 0 
                ? `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`
                : `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Load songs based on mood
        async function loadSongsByMood(mood) {
            currentMood = mood;
            document.getElementById('results-title').textContent = `${mood.charAt(0).toUpperCase() + mood.slice(1)} Songs`;
            
            // Show loading state
            const container = document.getElementById('results-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading songs...</p></div>';
            
            const query = moodQueries[mood] || mood;
            songs = await fetchYouTubeVideos(query);
            
            if (songs.length > 0) {
                displaySongs(songs);
                savePlayerState();
            } else {
                showError("No songs found. Try a different mood or search term.");
            }
        }

        function showError(message) {
            const container = document.getElementById('results-container');
            container.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>${message}</p>
                    <button onclick="retryLastSearch()">Retry</button>
                </div>
            `;
        }

        function retryLastSearch() {
            if (currentMood === 'search') {
                const query = document.getElementById('search-input').value.trim();
                if (query) {
                    fetchYouTubeVideos(query).then(result => {
                        songs = result;
                        displaySongs(songs);
                        savePlayerState();
                    });
                }
            } else {
                loadSongsByMood(currentMood);
            }
        }

        // Display songs in the results grid
        function displaySongs(songs) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            
            songs.forEach((song, index) => {
                const songCard = document.createElement('div');
                songCard.className = 'song-card' + (index === currentSongIndex ? ' now-playing' : '');
                songCard.innerHTML = `
                    <img class="song-thumbnail" src="${song.thumbnail}" alt="${song.title}">
                    <div class="play-overlay">
                        <div class="play-icon">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                        <div class="song-duration">${song.duration}</div>
                    </div>
                `;
                songCard.addEventListener('click', () => playSong(index));
                container.appendChild(songCard);
            });
        }

        // Play selected song
        function playSong(index) {
            if (index >= 0 && index < songs.length) {
                currentSongIndex = index;
                const song = songs[index];
                
                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById({
                        videoId: song.videoId,
                        suggestedQuality: 'default'
                    });
                    
                    updateCurrentSongInfo(song);
                    savePlayerState();
                    
                    // Update now-playing indicator
                    document.querySelectorAll('.song-card').forEach(card => {
                        card.classList.remove('now-playing');
                    });
                    document.querySelectorAll('.song-card')[index]?.classList.add('now-playing');
                }
            }
        }

        // Update player with current song info
        function updateCurrentSongInfo(song) {
            if (song) {
                document.getElementById('current-thumbnail').src = song.thumbnail;
                document.getElementById('current-title').textContent = song.title;
                document.getElementById('current-artist').textContent = song.artist;
            }
        }

        // Player controls
        function togglePlay() {
            if (isPlaying) {
                player.pauseVideo();
            } else {
                if (player.getPlayerState() === YT.PlayerState.UNSTARTED || 
                    player.getPlayerState() === YT.PlayerState.ENDED) {
                    playSong(currentSongIndex);
                } else {
                    player.playVideo();
                }
            }
        }

        function playPreviousSong() {
            let newIndex;
            if (isShuffleOn) {
                newIndex = Math.floor(Math.random() * songs.length);
            } else {
                newIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            }
            playSong(newIndex);
        }

        function playNextSong() {
            let newIndex;
            if (isShuffleOn) {
                newIndex = Math.floor(Math.random() * songs.length);
            } else {
                newIndex = (currentSongIndex + 1) % songs.length;
            }
            playSong(newIndex);
        }

        function toggleShuffle() {
            isShuffleOn = !isShuffleOn;
            const btn = document.getElementById('shuffle-btn');
            btn.style.color = isShuffleOn ? 'var(--primary-color)' : 'var(--text-color)';
            savePlayerState();
        }

        function toggleRepeat() {
            isRepeatOn = !isRepeatOn;
            const btn = document.getElementById('repeat-btn');
            btn.style.color = isRepeatOn ? 'var(--primary-color)' : 'var(--text-color)';
            savePlayerState();
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            // Load saved state first
            loadPlayerState();
            
            // Then initialize with current mood or default
            if (!songs.length) {
                loadSongsByMood(currentMood);
            }
            
            // Set up search handler
            document.getElementById('search-btn').addEventListener('click', () => {
                const query = document.getElementById('search-input').value.trim();
                if (query) {
                    currentMood = 'search';
                    document.getElementById('results-title').textContent = `Search: ${query}`;
                    fetchYouTubeVideos(query).then(result => {
                        songs = result;
                        displaySongs(songs);
                        savePlayerState();
                    });
                }
            });
            
            // Set up mood card handlers
            document.querySelectorAll('.mood-card').forEach(card => {
                card.addEventListener('click', () => {
                    const mood = card.getAttribute('data-mood');
                    loadSongsByMood(mood);
                });
            });
            
            // Set up player control buttons
            document.getElementById('play-btn').addEventListener('click', togglePlay);
            document.getElementById('prev-btn').addEventListener('click', playPreviousSong);
            document.getElementById('next-btn').addEventListener('click', playNextSong);
            document.getElementById('shuffle-btn').addEventListener('click', toggleShuffle);
            document.getElementById('repeat-btn').addEventListener('click', toggleRepeat);
            
            // Progress bar control
            document.getElementById('progress-bar').addEventListener('input', (e) => {
                if (player && player.getDuration) {
                    const duration = player.getDuration();
                    const newTime = (e.target.value / 100) * duration;
                    player.seekTo(newTime, true);
                }
            });

            // Volume control
            document.getElementById('volume-bar').addEventListener('input', (e) => {
                const volume = e.target.value;
                if (player) player.setVolume(volume);
                const icon = document.querySelector('.volume-control i');
                if (volume == 0) {
                    icon.className = 'fas fa-volume-mute';
                } else if (volume < 50) {
                    icon.className = 'fas fa-volume-down';
                } else {
                    icon.className = 'fas fa-volume-up';
                }
                savePlayerState();
            });
            
            // Save state when page is about to unload
            window.addEventListener('beforeunload', savePlayerState);
        });
    </script>
</body>
</html>
